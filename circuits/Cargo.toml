[workspace]
members = ["host", "methods", "methods/guest", "core"]
resolver = "2"

[workspace.dependencies]
risc0-zkvm = "1.2"
risc0-build = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
