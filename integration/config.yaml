# ZK Oracle Configuration
# =======================
ethereum:
  # Local Anvil node (start with: anvil)
  rpc_url: "http://127.0.0.1:8545"

  # Anvil's default first account
  submitter_address: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"

  # Set after deploying contracts (make contracts-deploy)
  oracle_address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"

agent:
  # Cryptocurrency to monitor
  default_asset: "solana"

  # LLM model for the agent
  model: "llama3.1"

  # How often to fetch data (in seconds)
  fetch_interval: 300

prover:
  # Timeout for proof generation (seconds)
  timeout: 300
